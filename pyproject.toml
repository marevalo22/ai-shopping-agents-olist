[project]
name = "agentshop"
version = "0.1.0"
description = "ACES-style experiments on how AI shopping agents choose among real Olist products"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "statsmodels>=0.14",
    "pyarrow>=15",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentshop"]
